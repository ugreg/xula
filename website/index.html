<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/xu.png">
    <meta name="description" content="XULA CPSC - Xavier University of Louisiana Computer Science, Coding, Programming & AI">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="preload" href="img/xu.png" as="image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com">
    <title>XULA CPSC</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
      }
    </script>
  </head>

  <body>
    <div class="background-gradient"></div>
    <div class="noise-overlay"></div>

    <div data-include="/pages/components/header.html"></div>

    <main>
      <div class="page-indicator">
        <span class="dot active" data-page="0"></span>
        <span class="dot" data-page="1"></span>
        <span class="dot" data-page="2"></span>
        <span class="dot" data-page="3"></span>
        <span class="dot" data-page="4"></span>
      </div>

      <button class="stats-arrow-btn" aria-label="View stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>

      <button class="stats-arrow-btn back hidden" aria-label="Back to home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>

      <div data-include="/pages/components/terminal.html"></div>

      <div id="carousel" class="carousel">
        <div class="carousel-page" id="page-hero" data-page="home"></div>
        <div class="carousel-page" id="page-calendar" data-page="calendar"></div>
        <div class="carousel-page" id="page-xavierites" data-page="xavierites"></div>
        <div class="carousel-page" id="page-skills" data-page="skills"></div>
        <div class="carousel-page" id="page-stats" data-page="stats"></div>
      </div>
    </main>

    <div data-include="/pages/components/footer.html"></div>

    <button class="scroll-top-btn" aria-label="Scroll to top">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 15l-6-6-6 6"/>
      </svg>
    </button>

    <script type="module" src="src/script.js"></script>
  </body>
</html>
