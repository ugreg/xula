<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="xu.png">
    <meta name="description" content="XULA CPSC - Xavier University of Louisiana Computer Science, Coding, Programming & AI">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="preload" href="xu.png" as="image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com">
    <title>XULA CPSC</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body class="loading">
    <div class="background-gradient"></div>
    <div class="noise-overlay"></div>

    <header style="position: fixed; top: 0; left: 0; right: 0; z-index: 200; padding: 20px; backdrop-filter: blur(20px); background: var(--glass-bg); border-bottom: 1px solid var(--glass-border);">
      <nav style="max-width: 1400px; margin: 0 auto; display: flex; justify-content: center; align-items: center; position: relative;">
        <img src="xu.png" alt="XULA" style="width: 64px; height: 64px; object-fit: contain;">

        <label class="theme-toggle" style="position: absolute; right: 0;" aria-label="Toggle dark/light mode">
          <input type="checkbox" id="themeToggle">

          <span class="slider">
            <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>

            <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
          </span>
        </label>
      </nav>
    </header>

    <div class="page-indicator">
      <span class="dot active" data-page="0"></span>
      <span class="dot" data-page="1"></span>
      <span class="dot" data-page="2"></span>
      <span class="dot" data-page="3"></span>
      <span class="dot" data-page="4"></span>
    </div>

    <button class="stats-arrow-btn" aria-label="View stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>

    <button class="stats-arrow-btn back hidden" aria-label="Back to home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <div id="carousel" class="carousel">
      <div class="carousel-page" id="page-hero">
        <iframe id="iframe-home" src="pages/home.html" frameborder="0" loading="eager"></iframe>
      </div>

      <div class="carousel-page" id="page-calendar">
        <iframe id="iframe-calendar" src="pages/calendar.html" frameborder="0" loading="eager"></iframe>
      </div>

      <div class="carousel-page" id="page-features">
        <iframe id="iframe-features" src="pages/features.html" frameborder="0" loading="eager"></iframe>
      </div>

      <div class="carousel-page" id="page-extensions">
        <iframe id="iframe-extensions" src="pages/extensions.html" frameborder="0" loading="eager"></iframe>
      </div>

      <div class="carousel-page" id="page-stats">
        <iframe id="iframe-stats" src="pages/stats.html" frameborder="0" loading="eager"></iframe>
      </div>
    </div>

    <footer class="footer">
      <p style="font-family: monospace;">Xavier University of Louisiana</p>
    </footer>

    <button class="scroll-top-btn" aria-label="Scroll to top">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 15l-6-6-6 6"/>
      </svg>
    </button>

    <script type="module" src="script.js"></script>
  </body>
</html>
