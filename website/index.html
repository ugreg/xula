<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/xu.png">
    <meta name="description" content="XULA CPSC - Xavier University of Louisiana Computer Science, Coding, Programming & AI">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="preload" href="img/xu.png" as="image">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com">
    <title>XULA CPSC</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
      }
    </script>
    <script src="src/includes.js" defer></script>
  </head>

  <body>
    <div class="background-gradient"></div>
    <div class="noise-overlay"></div>

    <div data-include="components/header.html"></div>

    <div class="page-indicator">
      <span class="dot active" data-page="0"></span>
      <span class="dot" data-page="1"></span>
      <span class="dot" data-page="2" style="display: none;"></span>
      <span class="dot" data-page="3" style="display: none;"></span>
      <span class="dot" data-page="4" style="display: none;"></span>
    </div>

    <button class="stats-arrow-btn" aria-label="View stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18l6-6-6-6"/>
      </svg>
    </button>

    <button class="stats-arrow-btn back hidden" aria-label="Back to home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <div id="homeTerminal" class="terminal-card">
      <div class="window">
        <div class="header">
          <div>
            <svg width="10" height="10" viewBox="0 0 10 10" style="display: inline-block;"><circle cx="5" cy="5" r="5" fill="#ff5f56"/></svg>
            <svg width="10" height="10" viewBox="0 0 10 10" style="display: inline-block;"><circle cx="5" cy="5" r="5" fill="#ffbd2e"/></svg>
            <svg width="10" height="10" viewBox="0 0 10 10" style="display: inline-block;"><circle cx="5" cy="5" r="5" fill="#27c93f"/></svg>
          </div>
          <span style="font-size: 12px; color: #a0a0a0; font-family: monospace; margin-left: 10px;">~</span>
          <div style="width: 14px;"></div>
        </div>

        <div class="body" style="padding: 15px; font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Mono', monospace; font-size: 14px; line-height: 1.6; height: calc(100% - 40px); overflow-y: auto; text-align: left;">
          <div style="color: #888; font-size: 12px; margin-bottom: 10px;">
            <span style="color: #27c93f;">$</span> ls -la
          </div>

          <div class="output">
            <span style="color: #86efac;">drwxr-xr-x</span> 2 chat uncs  4096 Oct 10 14:30 .
          </div>

          <div class="output">
            <span style="color: #86efac;">drwxr-xr-x</span> 2 chat uncs  4096 Oct 10 14:30 ..
          </div>

          <div class="output">
            <span style="color: #d4a574;">-rw-r--r--</span> 1 chat uncs  1024 Oct 10 14:30 subathon.txt
          </div>

          <div class="output">
            <span style="color: #d4a574;">-rw-r--r--</span> 1 chat uncs  2048 Oct 10 14:30 AGENTS.md
          </div>

          <div style="margin-top: 15px; color: #888;">
            <span style="color: #27c93f;">$</span> echo "Scroll down to see schedule"
          </div>

          <div class="output">
            Scroll down to see schedule
          </div>

          <div style="margin-top: 15px; color: #888;">
            <span style="color: #27c93f;">$</span> <span class="cursor"></span>
          </div>
        </div>
      </div>
    </div>

    <div id="carousel" class="carousel">
      <div class="carousel-page" id="page-hero" data-page="home"></div>
      <div class="carousel-page" id="page-calendar" data-page="calendar"></div>
      <div class="carousel-page" id="page-xavierites" data-page="xavierites" style="display: none;"></div>
      <div class="carousel-page" id="page-skills" data-page="skills" style="display: none;"></div>
      <div class="carousel-page" id="page-stats" data-page="stats" style="display: none;"></div>
    </div>

    <div data-include="components/footer.html"></div>

    <button class="scroll-top-btn" aria-label="Scroll to top">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 15l-6-6-6 6"/>
      </svg>
    </button>

    <script type="module" src="src/script.js"></script>
  </body>
</html>
