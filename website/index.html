<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="build-version" content="202610270616.4a1d225519a7862b952213b35e3667d252638efa">
    <link rel="icon" href="img/xu.png?v=202610270616.4a1d225519a7862b952213b35e3667d252638efa">
    <meta name="description" content="XULA CPSC - Xavier University of Louisiana Computer Science, Coding, Programming & AI">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="preload" href="img/xu.png?v=202610270616.4a1d225519a7862b952213b35e3667d252638efa" as="image">
    <link rel="preconnect" href="https://images.unsplash.com">
    <title>XULA CPSC</title>
    <link rel="stylesheet" href="style.css?v=202610270616.4a1d225519a7862b952213b35e3667d252638efa">
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
      }
    </script>
  </head>

  <body>
    <div class="background-gradient"></div>
    <div class="noise-overlay"></div>

    <div data-include="/pages/components/header.html"></div>

    <main>
      <div class="page-indicator">
        <span class="dot active" data-page="home"></span>
        <span class="dot" data-page="skills"></span>
        <span class="dot" data-page="stats"></span>
      </div>

      <button class="stats-arrow-btn" aria-label="View stats">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </button>

      <button class="stats-arrow-btn back hidden" aria-label="Back to home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>

      <div class="terminal-embed" data-include="/pages/components/terminal.html" data-desktop-only></div>

      <div id="carousel" class="carousel">
        <div class="carousel-page" id="page-hero" data-page="home"></div>
        <div style="display: none" class="carousel-page" id="page-xavierites" data-page="xavierites"></div>
        <div class="carousel-page" id="page-skills" data-page="skills"></div>
        <div class="carousel-page" id="page-stats" data-page="stats"></div>
      </div>
    </main>

    <div data-include="/pages/components/footer.html"></div>

    <div data-include="/pages/components/calendar.html"></div>

    <button class="scroll-top-btn" aria-label="Scroll to top">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 15l-6-6-6 6"/>
      </svg>
    </button>

    <button class="calendar-fab" data-calendar-open aria-expanded="false" aria-label="Open calendar">
      <img src="img/icon/calendar.svg?v=202610270616.4a1d225519a7862b952213b35e3667d252638efa" alt="Calendar">
      <span>Calendar</span>
    </button>

    <script type="module" src="src/script.js?v=202610270616.4a1d225519a7862b952213b35e3667d252638efa"></script>
  </body>
</html>
