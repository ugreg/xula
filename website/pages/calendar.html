<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../img/xu.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>XULA CPSC - Calendar</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../src/calendar.js"></script>
  </head>

  <body>
    <div data-include="/pages/components/header.html"></div>
    <div class="background-gradient"></div>
    <div class="noise-overlay"></div>

    <div id="sharedTerminal" class="terminal-card shared-terminal">
      <div class="window">
        <div class="header">
          <div>
            <svg width="10" height="10" viewBox="0 0 10 10" style="display: inline-block;"><circle cx="5" cy="5" r="5" fill="#ff5f56"/></svg>
            <svg width="10" height="10" viewBox="0 0 10 10" style="display: inline-block;"><circle cx="5" cy="5" r="5" fill="#ffbd2e"/></svg>
            <svg width="10" height="10" viewBox="0 0 10 10" style="display: inline-block;"><circle cx="5" cy="5" r="5" fill="#27c93f"/></svg>
          </div>
          <span style="font-size: 12px; color: #a0a0a0; font-family: monospace; margin-left: 10px;">xula-calendar</span>
          <div class="close-btn" id="closeTerminal">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a0a0a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </div>
        </div>
        <div class="body" id="terminalBody"></div>
      </div>
    </div>

    <section class="section calendar-section">
      <div class="calendar-container">
        <div class="calendar-card">
          <div class="calendar-header">
            <div class="header-left">
              <h1 class="year">2026</h1>
              <p class="subtitle">XULA TECH CALENDAR</p>
            </div>

            <div class="header-right">
              <div class="nav-btn" id="prevBtn">
                <svg viewBox="0 0 24 24" width="24" height="24">
                  <path fill="currentColor" d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
                </svg>
              </div>

              <h2 id="monthDisplay"></h2>

              <div class="nav-btn" id="nextBtn">
                <svg viewBox="0 0 24 24" width="24" height="24">
                  <path fill="currentColor" d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
                </svg>
              </div>

              <label class="toggle" aria-label="Toggle calendar/list view" style="margin-left: 16px;">
                <input type="checkbox" id="viewToggle">
                <span class="slider">
                  <img class="icon-left" src="../img/calendar.svg" alt="">
                  <img class="icon-right" src="../img/list.svg" alt="">
                </span>
              </label>
            </div>
          </div>

          <div class="calendar-body">
            <div class="days" id="calendarDays"></div>
          </div>

          <div class="calendar-footer"></div>
        </div>
      </div>
    </section>

    <div data-include="/pages/components/footer.html"></div>
  </body>
</html>
