<header style="position: fixed; top: 0; left: 0; right: 0; z-index: 200; padding: 20px; backdrop-filter: blur(20px); background: var(--glass-bg); border-bottom: 1px solid var(--glass-border);">
  <nav style="max-width: 1400px; margin: 0 auto; display: flex; justify-content: center; align-items: center; position: relative;">
    <div class="renderer-switch" role="radiogroup" aria-label="Shape renderer">
      <input type="radio" name="renderer" id="renderer-canvas" value="canvas2d" aria-label="Canvas 2D" checked>
      <label for="renderer-canvas" title="Canvas 2D">
        <svg class="rs-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
        <span class="rs-name">Canvas</span>
        <b class="rs-short" aria-hidden="true">C</b>
      </label>
      <input type="radio" name="renderer" id="renderer-ogl" value="ogl" aria-label="OGL WebGL">
      <label for="renderer-ogl" title="OGL WebGL">
        <svg class="rs-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/></svg>
        <span class="rs-name">OGL</span>
        <b class="rs-short" aria-hidden="true">O</b>
      </label>
      <input type="radio" name="renderer" id="renderer-zdog" value="zdog" aria-label="Zdog">
      <label for="renderer-zdog" title="Zdog">
        <svg class="rs-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2h0a3.13 3.13 0 0 1 3 3.88Z"/></svg>
        <span class="rs-name">Zdog</span>
        <b class="rs-short" aria-hidden="true">Z</b>
      </label>
    </div>

    <img src="/img/xu.png?v=202610280541.1932decc9592024f97254ffe723b733e46e7fa1f" alt="XULA" class="header-logo">

    <label class="toggle theme" style="position: absolute; right: 0;" aria-label="Toggle dark/light mode">
      <input type="checkbox" id="themeToggle">
      <span class="slider">
        <img class="icon-left" src="/img/icon/sol.svg?v=202610280541.1932decc9592024f97254ffe723b733e46e7fa1f" alt="">
        <img class="icon-right" src="/img/icon/luna.svg?v=202610280541.1932decc9592024f97254ffe723b733e46e7fa1f" alt="">
      </span>
    </label>
  </nav>
</header>

<script type="module" src="/pages/components/src/renderer-switch.js"></script>
