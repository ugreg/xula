<header style="position: fixed; top: 0; left: 0; right: 0; z-index: 200; padding: 20px; backdrop-filter: blur(20px); background: var(--glass-bg); border-bottom: 1px solid var(--glass-border);">
  <nav style="max-width: 1400px; margin: 0 auto; display: flex; justify-content: center; align-items: center; position: relative;">
    <div class="renderer-switch" role="radiogroup" aria-label="Shape renderer">
      <input type="radio" name="renderer" id="renderer-webgl" value="webgl" aria-label="WebGL 2" checked>
      <label for="renderer-webgl" title="WebGL 2"><img src="/img/icon/blocks.svg" alt="" aria-hidden="true"><span class="rs-name">WebGL</span><b class="rs-short" aria-hidden="true">GL</b></label>
      <input type="radio" name="renderer" id="renderer-webgpu" value="webgpu" aria-label="WebGPU">
      <label for="renderer-webgpu" title="WebGPU"><img src="/img/icon/cuboid.svg" alt="" aria-hidden="true"><span class="rs-name">WebGPU</span><b class="rs-short" aria-hidden="true">GP</b></label>
    </div>

    <img src="/img/xu.png" alt="XULA" class="header-logo">

    <label class="toggle theme" style="position: absolute; right: 0;" aria-label="Toggle dark/light mode">
      <input type="checkbox" id="themeToggle">
      <span class="slider">
        <img class="icon-left" src="/img/icon/sol.svg" alt="">
        <img class="icon-right" src="/img/icon/luna.svg" alt="">
      </span>
    </label>
  </nav>
</header>

<script type="module" src="/pages/components/src/renderer-switch.js"></script>
