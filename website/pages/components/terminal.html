<div class="terminal-card visible" id="homeTerminal">
  <div class="window">
    <div class="header">
      <div>
        <svg width="10" height="10" viewBox="0 0 10 10" style="display: inline-block;"><circle cx="5" cy="5" r="5" fill="#ff5f56"/></svg>
        <svg width="10" height="10" viewBox="0 0 10 10" style="display: inline-block;"><circle cx="5" cy="5" r="5" fill="#ffbd2e"/></svg>
        <svg width="10" height="10" viewBox="0 0 10 10" style="display: inline-block;"><circle cx="5" cy="5" r="5" fill="#27c93f"/></svg>
      </div>
      <span style="font-size: 12px; color: #a0a0a0; margin-left: 10px;">~</span>
      <div style="width: 14px;"></div>
      <button type="button" class="refresh-btn" data-terminal-reset aria-label="Reset terminal" title="Reset terminal">
        <img src="../img/icon/refresh.svg?v=202610290653.21940158c08b20ee85aaa20fce0edc7c581b141d" alt="" aria-hidden="true">
      </button>
    </div>
    <div class="body" data-terminal-body>
      <div>
        <div style="margin-bottom: 15px; color: var(--text-muted);">
          Last login: now on ttys001
        </div>
      </div>
      <div data-terminal-out></div>
    </div>
    <div class="prompt-line">
      <span class="prompt-sign">$</span>
      <input class="terminal-input" type="text" maxlength="25" data-terminal-input placeholder="type help" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" aria-label="Terminal command">
    </div>
  </div>
</div>
<script type="module" src="../pages/components/src/terminal.js"></script>
