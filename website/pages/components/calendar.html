<div class="calendar-modal" id="calendarModal">
  <div class="calendar-modal-backdrop"></div>
  <div class="calendar-modal-content">
    <section class="section calendar-section">
      <div class="calendar-container">
        <div class="calendar-card">
          <button class="calendar-modal-close" data-calendar-close aria-label="Close calendar">
            <img src="../img/icon/close.svg?v=202610290503.37229b5005359dcaae1fd81b897a86a50da0f224" alt="" aria-hidden="true">
          </button>
          <div class="calendar-header">
            <div class="header-left">
              <h1 class="year"></h1>
              <p class="subtitle">XULA TECH CALENDAR</p>
            </div>

            <div class="header-right">
              <div class="nav-btn" id="prevBtn">
                <img src="../img/icon/chevron-left.svg?v=202610290503.37229b5005359dcaae1fd81b897a86a50da0f224" alt="" aria-hidden="true">
              </div>

              <h2 id="monthDisplay"></h2>

              <div class="nav-btn" id="nextBtn">
                <img src="../img/icon/chevron-right.svg?v=202610290503.37229b5005359dcaae1fd81b897a86a50da0f224" alt="" aria-hidden="true">
              </div>

              <label class="toggle" aria-label="Toggle calendar/list view" style="margin-left: 16px;">
                <input type="checkbox" id="viewToggle" checked>
                <span class="slider">
                  <img class="icon-left" src="../img/icon/calendar.svg?v=202610290503.37229b5005359dcaae1fd81b897a86a50da0f224" alt="">
                  <img class="icon-right" src="../img/icon/list.svg?v=202610290503.37229b5005359dcaae1fd81b897a86a50da0f224" alt="">
                </span>
              </label>
            </div>
          </div>

          <div class="calendar-body">
            <div class="days" id="calendarDays"></div>
          </div>

        </div>
      </div>
    </section>
  </div>
</div>

<script type="module" src="../pages/components/src/calendar.js"></script>
